name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
            python_cmd: python3
          - os: ubuntu-latest
            python: "3.12"
            python_cmd: python3
          - os: ubuntu-latest
            python: "3.13"
            python_cmd: python3
          - os: macos-latest
            python: "3.12"
            python_cmd: python3
          - os: windows-latest
            python: "3.12"
            python_cmd: python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Validate skill structure
        run: ${{ matrix.python_cmd }} scripts/validate_skill.py
      - name: Run regression tests
        run: ${{ matrix.python_cmd }} -m unittest discover -s tests -v
      - name: Build deterministic skill package
        run: ${{ matrix.python_cmd }} scripts/package_skill.py
