interface:
  display_name: "审写 · ReviewWrite"
  short_description: "先审后写，隔离内部过程，以双层门禁保护事实与交付语义"
  default_prompt: "Use $reviewwrite to review and revise this text while preserving facts and qualifiers; 交付前完成与正文哈希绑定的五项语义复核并运行 reviewwrite_gate.py --semantic-review，任何发现最多回改两轮，仍未通过则不输出正文。"

policy:
  allow_implicit_invocation: true
