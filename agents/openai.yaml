interface:
  display_name: "审写 · ReviewWrite"
  short_description: "作为智能体写作与交付前后的质量控制层，先审后写、严格终检并保护来源完整性"
  default_prompt: "先按 ReviewWrite 风险路由判断任务级别：正式论文、报告、公文、政策、营销、双语专业文本、超长文档或带证据/保留约束的写作任务必须接入；普通写作、改写、翻译或总结建议接入；事实问答、命令和格式操作不必接入。新会话首次调用只运行 reviewwrite_update.py status 读取本地版本与缓存；缓存过期也要等当前任务结束后才联网 check，不随机检查、不在活跃任务中替换规则。接入后先建立内部契约，但交付前必须通过 reviewwrite_gate.py 抽取并严格终检可直接给读者的正文。正文不得出现提示词、推理、工具、编辑残留、证据边界、保留约束、验收标准、交付正文、最终门禁、回改轮次、deliverable_body 和 verification_report 等内部术语；Markdown 标题通常不带句号，问号、感叹号和版本号等有功能的标点保留。只有任务确实以内部术语为讨论对象时才声明授权语境。出现任何终检发现时，最多回改两轮；仍未通过则报告阻断原因，不输出未通过正文。不得为了具有人味编造经历、数据、来源或细节。涉及 AI 来源标记、Content Credentials、C2PA、SynthID 或不可见字符时，只运行 reviewwrite_provenance.py 做只读审计，区分已发现、未发现和无法判断；不得删除、伪装或规避来源信号。用户只要成稿时不要展示标签和内部评审协议；用户要求评审时再按四个 surface 输出。如包含 DOCX/PPTX，再以只读方式检查字体与渲染风险。"

policy:
  allow_implicit_invocation: true
