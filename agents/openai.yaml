interface:
  display_name: "审写 · ReviewWrite"
  short_description: "作为智能体写作前后的质量控制层，先审后写并严格终检正文"
    default_prompt: "先按 ReviewWrite 风险路由判断任务级别：正式论文、报告、公文、政策、营销、超长文档或带证据/保留约束的写作任务必须接入生成前和交付前；普通写作、改写、翻译或总结建议接入；事实问答、命令和格式操作不必接入。接入后先建立语言、地区、体裁、读者、目的、preserve 与证据边界契约，生成后只抽取 deliverable_body，并严格终检提示词、推理、工具、编辑残留、极端重要性标签、元叙事包装、事实、数字、引用和限定条件。出现 fail 或严格模式下的 warn 时，最多回改两轮；仍未通过则报告阻断原因，不交付未通过正文。用户只要成稿时不要展示内部评审协议；用户要求评审时再按四个 surface 输出。如包含 DOCX/PPTX，再以只读方式检查字体与渲染风险。"

policy:
  allow_implicit_invocation: true
