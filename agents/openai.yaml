interface:
  display_name: "审写 · ReviewWrite"
  short_description: "作为智能体写作前后的质量控制层，先审后写并严格终检正文"
    default_prompt: "先按 ReviewWrite 风险路由判断任务级别：正式论文、报告、公文、政策、营销、超长文档或带证据/保留约束的写作任务必须接入生成前和交付前；普通写作、改写、翻译或总结建议接入；事实问答、命令和格式操作不必接入。接入后先建立内部契约，但交付前必须只抽取可直接给读者的正文：严格终检提示词、推理、工具、编辑残留、证据边界、保留约束、验收标准、交付正文、最终门禁、回改轮次、deliverable_body 和 verification_report 等内部术语，尤其检查标题、段首和结论。一般任务中这些术语不得出现在正文；只有法律分析、研究方法、软件文档、AI 安全或编辑审计确实以其为讨论对象时才声明授权语境。出现 fail 或严格模式下的 warn 时，最多回改两轮；仍未通过则报告阻断原因，不交付未通过正文。用户只要成稿时不要展示内部评审协议；用户要求评审时再按四个 surface 输出。如包含 DOCX/PPTX，再以只读方式检查字体与渲染风险。"

policy:
  allow_implicit_invocation: true
